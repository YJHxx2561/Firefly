<style>
	.icp-footer {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 0.55rem;
		font-size: 0.8125rem;
		line-height: 1.6;
	}
	.site-uptime {
		display: inline-flex;
		align-items: center;
		flex-wrap: wrap;
		justify-content: center;
		gap: 0.45rem;
		padding: 0.34rem 0.85rem;
		border: 1px solid color-mix(in oklch, var(--primary) 30%, transparent);
		border-radius: 9999px;
		background: color-mix(in oklch, var(--primary) 8%, transparent);
		color: var(--content-meta);
		white-space: nowrap;
		transition: background-color .2s ease, border-color .2s ease;
	}
	.site-uptime:hover {
		background: color-mix(in oklch, var(--primary) 14%, transparent);
		border-color: color-mix(in oklch, var(--primary) 50%, transparent);
	}
	.site-uptime svg {
		color: var(--primary);
		flex: none;
	}
	.uptime-label {
		white-space: nowrap;
	}
	.uptime-value {
		display: inline-flex;
		align-items: baseline;
		flex-wrap: wrap;
		justify-content: center;
		gap: 0.3rem;
	}
	.uptime-unit {
		white-space: nowrap;
	}
	.uptime-num {
		color: var(--primary);
		font-weight: 600;
		font-variant-numeric: tabular-nums;
	}
	.uptime-sep {
		color: var(--primary);
		opacity: 0.45;
	}
	.visit-stats {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: 0.5rem;
	}
	.visit-stat {
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		padding: 0.28rem 0.7rem;
		border: 1px solid var(--line-color);
		border-radius: 9999px;
		background: color-mix(in oklch, var(--primary) 6%, transparent);
		color: var(--content-meta);
		white-space: nowrap;
		transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
	}
	.visit-stat:hover {
		background: color-mix(in oklch, var(--primary) 13%, transparent);
		border-color: color-mix(in oklch, var(--primary) 45%, transparent);
		transform: translateY(-1px);
	}
	.visit-stat svg {
		color: var(--primary);
		flex: none;
	}
	.stat-num {
		color: var(--primary);
		font-weight: 600;
		font-variant-numeric: tabular-nums;
		margin-left: 0.1rem;
	}
	.icp-line {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: 0.4rem;
		color: var(--content-meta);
	}
	.icp-item {
		display: inline-flex;
		align-items: center;
		gap: 0.3rem;
		white-space: nowrap;
	}
	.icp-line a {
		color: var(--content-meta);
		text-decoration: none;
		white-space: nowrap;
		border-bottom: 1px dashed color-mix(in oklch, var(--primary) 45%, transparent);
		transition: color .2s ease, border-color .2s ease;
	}
	.icp-line a:hover {
		color: var(--primary);
		border-bottom-color: var(--primary);
	}
	.icp-sep {
		color: var(--primary);
		opacity: 0.6;
	}
</style>
<footer class="icp-footer">
  <div class="site-uptime" id="site-uptime">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    </svg>
    <span class="uptime-label">本站已运行</span>
    <span class="uptime-value">
      <span class="uptime-unit"><span class="uptime-num" id="uptime-days">0</span> 天</span>
      <span class="uptime-sep" aria-hidden="true">·</span>
      <span class="uptime-unit"><span class="uptime-num" id="uptime-hours">00</span> 时</span>
      <span class="uptime-sep" aria-hidden="true">·</span>
      <span class="uptime-unit"><span class="uptime-num" id="uptime-minutes">00</span> 分</span>
      <span class="uptime-sep" aria-hidden="true">·</span>
      <span class="uptime-unit"><span class="uptime-num" id="uptime-seconds">00</span> 秒</span>
    </span>
  </div>
  <div class="visit-stats">
    <span class="visit-stat">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      本页访问人次:<span id="page_pv" class="stat-num">—</span>
    </span>
    <span class="visit-stat">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
      </svg>
      本页访问人数:<span id="page_uv" class="stat-num">—</span>
    </span>
  </div>
  <div class="icp-line">
    <span class="icp-item">
      <a href="https://icp.gov.moe/?keyword=20264680" target="_blank" rel="noopener noreferrer">萌ICP备20264680号</a>
    </span>
    <span class="icp-sep" aria-hidden="true">·</span>
    <span class="icp-item">
      Powered by <a href="https://yjhup.com" target="_blank" rel="noopener noreferrer">YJH</a>
    </span>
  </div>
</footer>

<script defer src="//stats.web.yjhup.com/js/index.min.js"></script>
<script>
  (function () {
    var START = new Date("2026-08-21T00:00:00+08:00").getTime();
    var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
    var set = function (id, value) {
      var el = document.getElementById(id);
      if (el) el.textContent = value;
    };
    var tick = function () {
      var diff = Math.max(0, Date.now() - START);
      var days = Math.floor(diff / 86400000);
      diff -= days * 86400000;
      var hours = Math.floor(diff / 3600000);
      diff -= hours * 3600000;
      var minutes = Math.floor(diff / 60000);
      diff -= minutes * 60000;
      var seconds = Math.floor(diff / 1000);
      set("uptime-days", String(days));
      set("uptime-hours", pad(hours));
      set("uptime-minutes", pad(minutes));
      set("uptime-seconds", pad(seconds));
    };
    tick();
    if (!window.__siteUptimeInit) {
      window.__siteUptimeInit = true;
      setInterval(tick, 1000);
      document.addEventListener("swup:contentReplaced", function () { setTimeout(tick, 100); });
    }
  })();
</script>
