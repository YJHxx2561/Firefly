<style>
	.icp-footer {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 0.55rem;
		font-size: 0.8125rem;
		line-height: 1.6;
	}
	.visit-stats {
		display: flex;
		flex-wrap: wrap;
		justify-content: center;
		gap: 0.5rem;
	}
	.visit-stat {
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		padding: 0.28rem 0.7rem;
		border: 1px solid var(--line-color);
		border-radius: 9999px;
		background: color-mix(in oklch, var(--primary) 6%, transparent);
		color: var(--content-meta);
		white-space: nowrap;
		transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
	}
	.visit-stat:hover {
		background: color-mix(in oklch, var(--primary) 13%, transparent);
		border-color: color-mix(in oklch, var(--primary) 45%, transparent);
		transform: translateY(-1px);
	}
	.visit-stat svg {
		color: var(--primary);
		flex: none;
	}
	.stat-num {
		color: var(--primary);
		font-weight: 600;
		font-variant-numeric: tabular-nums;
		margin-left: 0.1rem;
	}
	.icp-line {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: 0.4rem;
		color: var(--content-meta);
	}
	.icp-item {
		display: inline-flex;
		align-items: center;
		gap: 0.3rem;
		white-space: nowrap;
	}
	.icp-line a {
		color: var(--content-meta);
		text-decoration: none;
		white-space: nowrap;
		border-bottom: 1px dashed color-mix(in oklch, var(--primary) 45%, transparent);
		transition: color .2s ease, border-color .2s ease;
	}
	.icp-line a:hover {
		color: var(--primary);
		border-bottom-color: var(--primary);
	}
	.icp-sep {
		color: var(--primary);
		opacity: 0.6;
	}
</style>
